[package]
name = "pluginabi"
version = "0.1.2"
loft = ">=0.8"
api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads
description = "Plugin call protocol — the six-operation contract (initial_state / apply_op / make_op / render / snapshot / load_snapshot) as canonical-CBOR frames over a byte channel. Host-agnostic: no ABI, no shim, no runtime."
repository = "loft-libs-plugins"

[library]
entry = "src/pluginabi.loft"

[dependencies]
cbor   = ">=0.1.2"
crypto = ">=0.3.6"
